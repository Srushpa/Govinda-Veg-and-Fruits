<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shree Ram</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#f3f7f2;
max-width:430px;
margin:auto;
overflow-x:hidden;
padding-bottom:120px;
}

/* ================= HERO ================= */

.hero{

height:330px;

background:
linear-gradient(
rgba(0,0,0,0.06),
rgba(0,0,0,0.12)
),

url('https://wallpapercave.com/wp/wp3104916.jpg');

background-size:cover;
background-position:center;

border-bottom-left-radius:42px;
border-bottom-right-radius:42px;

position:relative;
overflow:hidden;

display:flex;
justify-content:center;
align-items:flex-start;

padding-top:35px;
}

/* overlay */

.hero::before{

content:'';

position:absolute;
inset:0;

background:
linear-gradient(
135deg,
rgba(34,197,94,0.10),
rgba(251,191,36,0.08),
rgba(34,197,94,0.10)
);

z-index:1;
}

/* sunlight glow */

.hero::after{

content:'';

position:absolute;

width:300px;
height:300px;

background:rgba(255,255,255,0.18);

filter:blur(90px);

border-radius:50%;

top:-80px;
right:-40px;

z-index:1;
}

/* floating fruits */

.fruit{
position:absolute;
font-size:34px;
animation:float 4s ease-in-out infinite;
opacity:0.95;
z-index:2;
}

.fruit1{
top:40px;
left:20px;
}

.fruit2{
top:70px;
right:28px;
animation-delay:1s;
}

.fruit3{
bottom:90px;
left:35px;
animation-delay:2s;
}

.fruit4{
bottom:60px;
right:30px;
animation-delay:1.5s;
}

.fruit5{
top:130px;
left:80px;
font-size:28px;
animation-delay:0.7s;
}

.fruit6{
bottom:120px;
right:100px;
font-size:30px;
animation-delay:2.5s;
}

@keyframes float{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-14px);
}

100%{
transform:translateY(0px);
}

}

/* ================= HERO CONTENT ================= */

.hero-content{

position:relative;
z-index:5;

width:100%;

display:flex;
justify-content:flex-start;
align-items:center;
flex-direction:column;
}

/* GOVINDA TITLE */

.hero-content h1{

font-size:35px;
font-weight:800;

color:white;

letter-spacing:0.5px;

line-height:0.1;

text-align:center;

margin-top:0.1px;

text-shadow:
0 5px 14px rgba(0,0,0,0.35);
}

/* separator */

.hero-divider{

width:180px;
height:2px;

background:rgba(255,255,255,0.85);

margin:16px auto 14px;

border-radius:10px;

position:relative;
}

.hero-divider::after{

content:'❖';

position:absolute;

left:50%;
top:50%;

transform:translate(-50%,-50%);

background:transparent;

padding:0 10px;

color:#ffd43b;

font-size:16px;
}

/* tagline */

.tagline{

font-size:18px;
font-weight:600;

color:white;

text-align:center;

line-height:1.5;

text-shadow:
0 2px 8px rgba(0,0,0,0.35);

margin-top:4px;
}
.peacock{
color:#ffd43b;
}

/* ================= AUTH ================= */

.auth-wrapper{

margin-top:-40px;
padding:0 16px;

position:relative;
z-index:10;
}

.auth-card{

background:white;

border-radius:36px;

padding:18px;

box-shadow:
0 14px 34px rgba(0,0,0,0.10);
}

/* tabs */

.tabs{

display:flex;

background:#f4f4f5;

border-radius:18px;

padding:4px;

margin-bottom:18px;
}

.tab{

flex:1;

padding:14px 8px;

border-radius:16px;

font-size:14px;
font-weight:600;

text-align:center;

cursor:pointer;

transition:0.25s;

color:#71717a;
}

.active-tab{

background:white;

color:#0f9f0f;

box-shadow:
0 5px 14px rgba(0,0,0,0.06);

border-bottom:3px solid #16a34a;
}

/* form */

.form-grid{

display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}

.full{
grid-column:1 / 3;
}

.input-box{
position:relative;
}

.input-box span{

position:absolute;

left:18px;
top:16px;

font-size:22px;
}

.input-box input{

width:100%;
height:58px;

border-radius:18px;

border:1px solid #e5e7eb;

background:#fafafa;

padding-left:56px;
padding-right:16px;

font-size:13px;

outline:none;

transition:0.25s;
}

.input-box input:focus{

background:white;

border-color:#16a34a;

box-shadow:
0 0 0 4px rgba(22,163,74,0.08);
}

/* buttons */

.main-btn{

width:100%;
height:60px;

margin-top:20px;

border:none;

border-radius:18px;

background:
linear-gradient(135deg,#13b113,#048104);

color:white;

font-size:22px;
font-weight:700;

cursor:pointer;

box-shadow:
0 10px 24px rgba(22,163,74,0.25);

transition:0.25s;
}

.main-btn:hover{
transform:translateY(-2px);
}

.bottom-login{

margin-top:22px;

text-align:center;

font-size:16px;
color:#71717a;

position:relative;
}

.bottom-login::before,
.bottom-login::after{

content:'';

display:inline-block;

width:24%;
height:1px;

background:#e5e7eb;

vertical-align:middle;

margin:0 10px;
}

.login-btn{

width:100%;
height:58px;

margin-top:16px;

border-radius:18px;

border:2px solid #16a34a;

background:white;

color:#15803d;

font-size:22px;
font-weight:700;

cursor:pointer;
}

/* security */

.security{

margin:18px auto 0;

width:max-content;

background:#eefbf1;

padding:12px 22px;

border-radius:999px;

font-size:14px;

color:#4b5563;

box-shadow:
0 4px 10px rgba(0,0,0,0.05);
}

.security b{
color:#15803d;
}

/* toast */

.toast{

position:fixed;

top:20px;
left:50%;

transform:translateX(-50%);

background:#111827;

color:white;

padding:12px 18px;

border-radius:14px;

display:none;

z-index:9999;
}

</style>

</head>

<body>

<div class="toast" id="toast"></div>

<!-- HERO -->

<section class="hero">

<div class="hero-content">

<h1>
Govinda<span class="peacock">🪶</span>
</h1>

<div class="hero-divider"></div>

<p class="tagline">
Fresh Vegetables and Fruits Delivered Home
</p>

</div>

</section>

<!-- AUTH -->

<div class="auth-wrapper" id="authSection">

<div class="auth-card">

<div class="tabs">

<div
class="tab active-tab"
id="registerTab"
onclick="showRegister()">

👤 Create Account

</div>

<div
class="tab"
id="loginTab"
onclick="showLogin()">

🔐 Login

</div>

</div>

<!-- REGISTER -->

<div id="registerForm">

<div class="form-grid">

<div class="input-box">
<span>👤</span>
<input type="text" placeholder="Full Name">
</div>

<div class="input-box">
<span>✉️</span>
<input type="email" placeholder="Email Address">
</div>

<div class="input-box full">
<span>📱</span>
<input type="text" id="regWhatsapp" placeholder="WhatsApp Number">
</div>

<div class="input-box full">
<span>🏢</span>
<input type="text" placeholder="Society / Apartment Name">
</div>

<div class="input-box">
<span>🏠</span>
<input type="text" placeholder="Building Number">
</div>

<div class="input-box">
<span>🚪</span>
<input type="text" placeholder="Flat Number">
</div>

<div class="input-box full">
<span>🔒</span>
<input type="password" placeholder="Create Password">
</div>

</div>

<button
class="main-btn"
onclick="registerUser()">

➕ Create Account

</button>

<div class="bottom-login">

Already have an account?

<button
class="login-btn"
onclick="showLogin()">

↪ Login Here

</button>

</div>

</div>

<!-- LOGIN -->

<div id="loginForm" style="display:none;">

<div class="form-grid">

<div class="input-box full">
<span>📱</span>
<input type="text" id="loginWhatsapp" placeholder="WhatsApp Number">
</div>

<div class="input-box full">
<span>🔒</span>
<input type="password" placeholder="Password">
</div>

</div>

<button
class="main-btn"
onclick="loginUser()">

🔓 Login

</button>

</div>

</div>

<div class="security">
🛡️ Your information is <b>safe & secure</b> with us
</div>

</div>

<script>

function showRegister(){

document.getElementById('registerForm').style.display='block';
document.getElementById('loginForm').style.display='none';

document.getElementById('registerTab').classList.add('active-tab');
document.getElementById('loginTab').classList.remove('active-tab');

}

function showLogin(){

document.getElementById('registerForm').style.display='none';
document.getElementById('loginForm').style.display='block';

document.getElementById('loginTab').classList.add('active-tab');
document.getElementById('registerTab').classList.remove('active-tab');

}

function registerUser(){

const toast = document.getElementById('toast');

toast.innerText = "Registration Successful";
toast.style.display = 'block';

setTimeout(()=>{
toast.style.display = 'none';
showLogin();
},2000);

}

function loginUser(){

const toast = document.getElementById('toast');

toast.innerText = "Login Successful";
toast.style.display = 'block';

setTimeout(()=>{
toast.style.display = 'none';
},2000);

}

</script>

</body>
</html>
