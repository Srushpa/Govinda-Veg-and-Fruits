<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Govinda Fresh</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --primary:#1B5E20;
  --secondary:#2E7D32;
  --bg:#F4F7F4;
  --card:#ffffff;
  --text:#1F2937;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:var(--bg);
  max-width:430px;
  margin:auto;
  color:var(--text);
  padding-bottom:120px;
}

header{
  background:linear-gradient(135deg,#1B5E20,#43A047);
  color:white;
  padding:16px;
  border-radius:0 0 24px 24px;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 5px 18px rgba(0,0,0,0.15);
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:50px;
  height:50px;
  border-radius:16px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
}

.brand h1{
  font-size:19px;
}

.brand p{
  font-size:11px;
  opacity:0.9;
}

.cart-badge{
  background:white;
  color:var(--primary);
  padding:9px 14px;
  border-radius:14px;
  font-weight:700;
}

.search-box{
  margin-top:16px;
}

.search-box input{
  width:100%;
  padding:13px;
  border:none;
  border-radius:14px;
  outline:none;
  font-size:14px;
}

.banner{
  margin:16px;
  background:linear-gradient(135deg,#FFE082,#FFD54F);
  border-radius:20px;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 5px 18px rgba(0,0,0,0.08);
}

.banner h2{
  font-size:17px;
  margin-bottom:6px;
}

.banner p{
  font-size:12px;
}

.container{
  padding:16px;
}

.card{
  background:var(--card);
  border-radius:22px;
  padding:18px;
  box-shadow:0 5px 18px rgba(0,0,0,0.06);
  margin-bottom:20px;
}

h2{
  margin-bottom:16px;
  color:var(--primary);
  font-size:20px;
}

form{
  display:flex;
  flex-direction:column;
  gap:12px;
}

input,select{
  width:100%;
  padding:13px;
  border-radius:14px;
  border:1px solid #ddd;
  font-size:14px;
  outline:none;
}

button{
  border:none;
  background:var(--secondary);
  color:white;
  padding:13px;
  border-radius:14px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

button:active{
  transform:scale(0.97);
}

.center{
  text-align:center;
}

.hidden{
  display:none;
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.tab-btn{
  flex:1;
  background:#E8F5E9;
  color:var(--primary);
}

.products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.product-card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 16px rgba(0,0,0,0.08);
}

.product-image{
  width:100%;
  height:110px;
  object-fit:cover;
}

.product-content{
  padding:12px;
}

.product-content h3{
  font-size:14px;
  margin-bottom:5px;
}

.product-content p{
  font-size:11px;
  color:#666;
  min-height:26px;
}

.price{
  font-size:18px;
  font-weight:700;
  color:var(--primary);
  margin-top:8px;
}

.qty-controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin-top:10px;
}

.qty-controls button{
  width:28px;
  height:28px;
  border-radius:50%;
  padding:0;
}

.qty-controls input{
  width:50px;
  padding:8px;
  text-align:center;
}

.add-btn{
  width:100%;
  margin-top:10px;
}

.cart-item{
  border-bottom:1px solid #eee;
  padding:12px 0;
}

.total{
  margin-top:16px;
  font-size:22px;
  font-weight:700;
  color:#1B5E20;
}

.floating-cart{
  position:fixed;
  bottom:72px;
  left:50%;
  transform:translateX(-50%);
  width:92%;
  max-width:420px;
  background:#1B5E20;
  color:white;
  padding:14px 18px;
  border-radius:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:999;
  box-shadow:0 8px 25px rgba(0,0,0,0.2);
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:430px;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:12px 0;
  border-top:1px solid #ddd;
}

.bottom-nav div{
  font-size:12px;
  text-align:center;
  color:#1B5E20;
}

.toast{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  background:#111827;
  color:white;
  padding:12px 18px;
  border-radius:12px;
  display:none;
  z-index:9999;
}

@media(max-width:420px){

.products{
  grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="toast" id="toast"></div>

<header>

<div class="topbar">

<div class="brand">

<div class="logo">🦚</div>

<div>
<h1>Govinda Fresh</h1>
<p>Fresh Fruits & Vegetables</p>
</div>

</div>

<div class="cart-badge">
🛒 <span id="cartCount">0</span>
</div>

</div>

<div class="search-box hidden" id="searchSection">

<input
type="text"
id="searchInput"
placeholder="Search products..."
onkeyup="searchProducts()">

</div>

</header>

<div class="banner">
<div>
<h2>Fresh Daily Delivery</h2>
<p>Pune Fast Delivery</p>
</div>

<div style="font-size:40px;">🥬</div>
</div>

<div class="container">

<div class="card" id="authSection">

<div id="registerBlock">

<h2>Create Account</h2>

<form id="registrationForm">

<input type="text"
placeholder="Full Name"
required>

<input type="email"
placeholder="Email Address"
required>

<input type="text"
id="whatsappNumber"
placeholder="WhatsApp Number"
required>

<input type="text"
placeholder="Society Name"
required>

<input type="text"
placeholder="Building Number"
required>

<input type="text"
placeholder="Flat Number"
required>

<input type="password"
placeholder="Create Password"
required>

<button type="submit">
Register Now
</button>

</form>

<br>

<div class="center">

<p>Already Registered?</p>

<br>

<button onclick="showLogin()">
Login Here
</button>

</div>

</div>

<div id="loginBlock"
style="display:none;">

<h2>Customer Login</h2>

<form id="loginForm">

<input
type="text"
id="loginWhatsapp"
placeholder="WhatsApp Number"
required>

<input
type="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

<br>

<div class="center">

<p>New User?</p>

<br>

<button onclick="showRegister()">
Create Account
</button>

</div>

</div>

</div>

<div id="shopSection"
class="hidden">

<div class="tabs">

<button class="tab-btn"
onclick="showTab('veg')">

🥦 Vegetables

</button>

<button class="tab-btn"
onclick="showTab('fruits')">

🍎 Fruits

</button>

</div>

<div id="vegSection"
class="products"></div>

<div id="fruitSection"
class="products hidden"></div>

<div class="card">

<h2>Your Cart</h2>

<div id="cartItems"></div>

<br>

<select id="deliverySlot">

<option>7 AM - 9 AM</option>
<option>9 AM - 11 AM</option>
<option>5 PM - 7 PM</option>

</select>

<br><br>

<select id="paymentMode">

<option>Cash On Delivery</option>
<option>UPI</option>

</select>

<div class="total">
₹ <span id="cartTotal">0</span>
</div>

<br>

<button onclick="submitOrder()">
Place Order
</button>

</div>

</div>

</div>

<div class="floating-cart hidden"
id="floatingCart">

<div>

<strong>
<span id="cartItemsCount">0</span> Items
</strong>

<p>
₹ <span id="cartTotalBottom">0</span>
</p>

</div>

<button
onclick="window.scrollTo(0,document.body.scrollHeight)">

View Cart

</button>

</div>

<div class="bottom-nav hidden"
id="bottomNav">

<div>🏠<br>Home</div>
<div>🛒<br>Cart</div>
<div>👤<br>Profile</div>

</div>

<script>

let currentWhatsapp = "";

let cart = [];

const vegProducts = [

["Tomato","Fresh tomatoes","40","https://images.unsplash.com/photo-1546094096-0df4bcaaa337"],

["Potato","Organic potatoes","30","https://images.unsplash.com/photo-1518977676601-b53f82aba655"],

["Onion","Premium onions","35","https://images.unsplash.com/photo-1508747703725-719777637510"]

];

const fruitProducts = [

["Apple","Fresh apples","120","https://images.unsplash.com/photo-1567306226416-28f0efdc88ce"],

["Banana","Fresh bananas","60","https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e"],

["Orange","Juicy oranges","90","https://images.unsplash.com/photo-1580052614034-c55d20bfee3b"]

];

function showToast(message){

const toast =
document.getElementById('toast');

toast.innerText = message;

toast.style.display='block';

setTimeout(()=>{
toast.style.display='none';
},2000);

}

function showLogin(){

document.getElementById('registerBlock')
.style.display='none';

document.getElementById('loginBlock')
.style.display='block';

}

function showRegister(){

document.getElementById('registerBlock')
.style.display='block';

document.getElementById('loginBlock')
.style.display='none';

}

document.getElementById('registrationForm')
.addEventListener('submit',function(e){

e.preventDefault();

showToast("Registration successful");

showLogin();

});

document.getElementById('loginForm')
.addEventListener('submit',function(e){

e.preventDefault();

currentWhatsapp =
document.getElementById('loginWhatsapp').value;

document.getElementById('authSection')
.style.display='none';

document.getElementById('shopSection')
.classList.remove('hidden');

document.getElementById('searchSection')
.classList.remove('hidden');

document.getElementById('floatingCart')
.classList.remove('hidden');

document.getElementById('bottomNav')
.classList.remove('hidden');

loadProducts();

showToast("Welcome Back");

});

function loadProducts(){

renderProducts(vegProducts,'vegSection');

renderProducts(fruitProducts,'fruitSection');

}

function renderProducts(data,section){

let html='';

data.forEach(item=>{

html += `

<div class="product-card product-item">

<img src="${item[3]}"
class="product-image">

<div class="product-content">

<h3>${item[0]}</h3>

<p>${item[1]}</p>

<div class="price">
₹ ${item[2]}
</div>

<div class="qty-controls">

<button onclick="changeQty('${item[0]}',-1)">
−
</button>

<input
type="number"
value="1"
min="1"
id="qty-${item[0]}">

<button onclick="changeQty('${item[0]}',1)">
+
</button>

</div>

<button
class="add-btn"
onclick="addToCart('${item[0]}','${item[2]}')">

Add To Cart

</button>

</div>

</div>

`;

});

document.getElementById(section)
.innerHTML = html;

}

function showTab(tab){

document.getElementById('vegSection')
.classList.add('hidden');

document.getElementById('fruitSection')
.classList.add('hidden');

if(tab==='veg'){

document.getElementById('vegSection')
.classList.remove('hidden');

}

if(tab==='fruits'){

document.getElementById('fruitSection')
.classList.remove('hidden');

}

}

function searchProducts(){

const input =
document.getElementById('searchInput')
.value.toLowerCase();

const items =
document.querySelectorAll('.product-item');

items.forEach(item=>{

const text =
item.innerText.toLowerCase();

item.style.display =
text.includes(input)
? 'block'
: 'none';

});

}

function changeQty(item,change){

const input =
document.getElementById(`qty-${item}`);

let value = Number(input.value);

value += change;

if(value < 1) value = 1;

input.value = value;

}

function addToCart(item,price){

const qty =
Number(document.getElementById(`qty-${item}`).value);

const total =
qty * Number(price);

cart.push({
item,
qty,
price,
total
});

renderCart();

showToast("Added To Cart");

}

function renderCart(){

let html='';

let grandTotal=0;

cart.forEach(c=>{

grandTotal += c.total;

html += `

<div class="cart-item">

<strong>${c.item}</strong><br>

Qty: ${c.qty}<br>

₹ ${c.total}

</div>

`;

});

document.getElementById('cartItems')
.innerHTML = html;

document.getElementById('cartTotal')
.innerText = grandTotal;

document.getElementById('cartTotalBottom')
.innerText = grandTotal;

document.getElementById('cartCount')
.innerText = cart.length;

document.getElementById('cartItemsCount')
.innerText = cart.length;

}

function submitOrder(){

if(cart.length===0){

showToast("Cart Is Empty");

return;

}

let total=0;

cart.forEach(c=>{
total += c.total;
});

const orderText =
cart.map(c =>
`${c.item} x ${c.qty} = ₹${c.total}`
).join('\n');

const message = `

🛒 Govinda Fresh Order

Items:
${orderText}

Delivery Slot:
${document.getElementById('deliverySlot').value}

Payment:
${document.getElementById('paymentMode').value}

Total:
₹${total}

Thank You ❤️

`;

window.open(
`https://wa.me/91${currentWhatsapp}?text=${encodeURIComponent(message)}`,
'_blank'
);

showToast("Order Placed Successfully");

cart=[];

renderCart();

}

</script>

</body>

</html>
